services:
  # Redis service for Django Channels
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL database (optional - you can use SQLite in development)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pashusagar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Django backend
  backend:
    build: 
      context: ./pashusagar_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./pashusagar_backend:/app
      - media_files:/app/media
    environment:
      - DEBUG=True
      - DATABASE_URL=sqlite:///db.sqlite3
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Uses the startup script from Dockerfile

  # React frontend
  frontend:
    build:
      context: ./pashusagar_frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  media_files: